name: Build and deploy site

"on":
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the reviewed main branch to GitHub Pages
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build Jekyll site
        env:
          JEKYLL_ENV: production
        run: bundle exec jekyll build
      - name: Check required pages
        run: |
          test -s _site/index.html
          test -s _site/publications/index.html
          test -s _site/research/index.html
          test -s _site/assets/img/portrait.jpg
          test -s _site/assets/css/academic.css
      - name: Reject private source files from the artifact
        run: |
          forbidden=$(find _site \( -type l -o -name '.git' -o -iname 'profile.json' \
            -o -iname '*.tex' -o -iname 'resume.cls' -o -iname 'photo.jpg' \
            -o -name '.env' -o -name '.env.*' -o -iname '*.pem' -o -iname '*.key' \) \
            -print -quit)
          if test -n "$forbidden"; then
            echo "::error::Pages output contains a private source file or a symbolic link."
            exit 1
          fi
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    if: inputs.publish && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
